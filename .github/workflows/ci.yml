name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generated map data is up to date
        run: |
          npm run build:geo
          git diff --exit-code -- src/data/generated/shapes.json src/data/generated/worldMap.json src/data/generated/regionViews.json
